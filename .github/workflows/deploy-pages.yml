name: Deploy Schym to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export for GitHub Pages
        run: |
          rm -rf src/app/api
          cat << 'EOF' > src/app/page.tsx
          import { buildPreseededDataset } from "@/lib/hevy-seed";
          import { FitnessDashboard } from "@/components/FitnessDashboard";

          export default function HomePage() {
            const initialData = buildPreseededDataset();
            const todayIso = new Date().toISOString().slice(0, 10);
            return <FitnessDashboard initialData={initialData} todayIso={todayIso} />;
          }
          EOF

      - name: Build Next.js Static Export
        env:
          SCHYM_STATIC_EXPORT: "true"
        run: npm run build

      - name: Add .nojekyll for GitHub Pages
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
